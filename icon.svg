<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Fondo cálido de la app -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>
  
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- Sol Radiante Superior -->
  <g transform="translate(0, -10)">
    <circle cx="256" cy="135" r="46" fill="#facc15"/>
    <g stroke="#fef08a" stroke-width="12" stroke-linecap="round">
      <line x1="256" y1="50" x2="256" y2="70"/>
      <line x1="256" y1="200" x2="256" y2="220"/>
      <line x1="171" y1="135" x2="191" y2="135"/>
      <line x1="321" y1="135" x2="341" y2="135"/>
      <line x1="196" y1="75" x2="210" y2="89"/>
      <line x1="302" y1="181" x2="316" y2="195"/>
      <line x1="196" y1="195" x2="210" y2="181"/>
      <line x1="302" y1="89" x2="316" y2="75"/>
    </g>
  </g>

  <!-- Catálogo Cerrado en Perspectiva 3D (Idéntico a tu boceto) -->
  <g transform="translate(0, 10)">
    <!-- Sombra en el piso -->
    <polygon points="160,425 370,425 340,450 130,450" fill="#9a3412" opacity="0.4"/>
    
    <!-- Bloque de páginas blancas (Grosor derecho) -->
    <polygon points="315,250 355,265 355,415 315,400" fill="#e2e8f0"/>
    <polygon points="315,250 340,270 340,420 315,400" fill="#f8fafc"/>

    <!-- Portada Principal Base (Azul medio) -->
    <polygon points="150,270 315,250 315,400 150,420" fill="#60a5fa"/>
    
    <!-- Mitad izquierda más clara (Celeste) -->
    <polygon points="150,270 232.5,260 232.5,410 150,420" fill="#93c5fd"/>
    
    <!-- Cuadro Blanco de Título -->
    <polygon points="170,290 270,278 270,318 170,330" fill="#ffffff" opacity="0.95"/>
    
    <!-- Círculo Amarillo -->
    <circle cx="260" cy="345" r="28" fill="#fde047"/>
    
    <!-- Óvalo Naranja -->
    <ellipse cx="190" cy="370" rx="20" ry="45" fill="#ea580c" transform="rotate(-15, 190, 370)"/>
    
    <!-- Duna / Curva Amarilla Inferior -->
    <path d="M 150 405 Q 232.5 355 315 375 L 315 400 L 150 420 Z" fill="#facc15"/>
  </g>
</svg>
